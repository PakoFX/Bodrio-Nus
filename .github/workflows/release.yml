name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify signing keystore
        run: |
          keytool -list -keystore app/bodrio.keystore -storepass android -alias bodrio

      - name: Build Debug APK (signed with bodrio.keystore)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Report Build Failure to Summary
        if: failure()
        run: |
          echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to git branch
        if: failure()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -B build-logs
          tail -n 120 build_output.log > last_build_error.txt
          git add last_build_error.txt
          git commit -m "ci: capture build error"
          git push -f origin build-logs

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/BodrioNus.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apk/BodrioNus.apk
          name: Bodrio-Nus ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
