name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore keystore from secret (safe fallback)
        run: |
          if [ -n "${{ secrets.BODRIO_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.BODRIO_KEYSTORE_B64 }}" | base64 --decode > app/bodrio.keystore.tmp
            if [ -s app/bodrio.keystore.tmp ]; then
              mv app/bodrio.keystore.tmp app/bodrio.keystore
            fi
          elif [ -n "${{ secrets.BODRIO_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.BODRIO_KEYSTORE_BASE64 }}" | base64 --decode > app/bodrio.keystore.tmp
            if [ -s app/bodrio.keystore.tmp ]; then
              mv app/bodrio.keystore.tmp app/bodrio.keystore
            fi
          fi
          ls -lh app/bodrio.keystore

      - name: Build Debug APK (signed with bodrio.keystore)
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/BodrioNus.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apk/BodrioNus.apk
          name: Bodrio-Nus ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
